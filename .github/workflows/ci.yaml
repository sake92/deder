
name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_call:  # allow this workflow to be called from other workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: coursier/cache-action@v7
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Install pkl
        run: brew install pkl
      - name: Unit + config tests
        shell: bash -eo pipefail {0}
        run: |
          ./scripts/gen-config-bindings.sh
          deder exec -t test -m server-test -m test-common-test
          pkl test config/DederProjectTest.pkl
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '.deder/out/**/reports/junit/TEST-*.xml'
      - name: Deder output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log

  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true # allow flaky for now
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      # for testing importing from sbt
      - uses: sbt/setup-sbt@v1
      - name: Integration Test Suite
        run: |
          ./scripts/run-it-tests.sh
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '.deder/out/**/reports/junit/TEST-*.xml'
      - name: Deder output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log
