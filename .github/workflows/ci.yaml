
name: CI

on:
  push:
    branches: main
  pull_request:
  workflow_call:  # allow this workflow to be called from other workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore Deder output cache
        id: deder-output-cache
        uses: actions/cache/restore@v4
        with:
          path: .deder/out
          key: deder-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            deder-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: coursier/cache-action@v7
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      - name: Install pkl
        run: brew install pkl
      - name: Unit + config tests
        shell: bash -eo pipefail {0}
        run: |
          ./scripts/gen-config-bindings.sh
          # Bootstrap with the released server, then test with this branch's Scala runtime.
          deder exec -t assembly -m test-runner
          echo "testRunnerLocalPath=$(realpath .deder/out/test-runner/assembly/out.jar)" >> .deder/server.properties
          deder shutdown && sleep 1
          deder exec -t test -m server-test -m deder-common-test
          pkl test config/DederProjectTest.pkl
      - name: Build Windows test server
        run: deder exec --log-level warning --no-color -t assembly -m server -m test-runner
      - name: Upload Windows test server
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-server
          include-hidden-files: true
          path: |
            .deder/out/server/assembly/out.jar
            .deder/out/test-runner/assembly/out.jar
      - name: Upload generated config bindings
        uses: actions/upload-artifact@v4
        with:
          name: windows-config-bindings
          path: |
            config/src/
            config/resources/
      - name: Save Deder output cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deder-output-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .deder/out
          key: deder-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '.deder/out/**/reports/junit/TEST-*.xml'
      - name: Deder output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log

  integration-tests:
    name: Integration tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    continue-on-error: true # allow flaky for now
    strategy:
      fail-fast: false
      matrix:
        module: [jvm-integration-test, scalajs-integration-test, scalanative-integration-test, bsp-integration-test]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore Deder output cache
        uses: actions/cache/restore@v4
        with:
          path: .deder/out
          key: deder-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            deder-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      # for testing importing from sbt
      - uses: sbt/setup-sbt@v1
        if: matrix.module == 'jvm-integration-test'
        with:
          sbt-runner-version: 1.12.11
      - name: Integration Test Suite (${{ matrix.module }})
        run: |
          ./scripts/run-it-tests.sh "${{ matrix.module }}"
      - name: Publish Test Report (${{ matrix.module }})
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          check_name: Integration tests (${{ matrix.module }})
          report_paths: '.deder/out/**/reports/junit/TEST-*.xml'
      - name: Deder output (${{ matrix.module }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-integration-${{ matrix.module }}
          path: |
            .deder/logs/server.log
            .deder/out/**/reports/junit/TEST-*.xml

  windows-tests:
    continue-on-error: true # Report Windows failures without blocking CI or early-access.
    needs: [tests]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: windows-test-server
          path: bootstrap
      - name: Download generated config bindings
        uses: actions/download-artifact@v4
        with:
          name: windows-config-bindings
          path: config
      - uses: MinoruSekine/setup-scoop@v4.0.2
      - name: Install bootstrap client
        shell: pwsh
        run: |
          scoop bucket add sake92 https://github.com/sake92/scoop-bucket.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          scoop install deder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Deliberately do not restore .deder/out: exercise a clean compile.
      - name: Compile client with dependencies on another drive
        shell: bash
        run: |
          project_root="$(cygpath -m "$PWD")"
          user_home="$(cygpath -m "$USERPROFILE")"
          test "${project_root:0:2}" != "${user_home:0:2}"
          export COURSIER_CACHE="$user_home/.cache/deder-windows-smoke"
          mkdir -p .deder
          echo "localPath=$project_root/bootstrap/server/assembly/out.jar" >> .deder/server.properties
          echo "testRunnerLocalPath=$project_root/bootstrap/test-runner/assembly/out.jar" >> .deder/server.properties
          deder exec --log-level warning --no-color -m client -t assembly
          test -f .deder/out/client/assembly/out.jar
          test -f .deder/out/client/compile/zinc/inc_compile.zip
          # Read the saved analysis as well as writing it.
          echo '// Windows incremental compile smoke test' >> client/src/ba/sake/deder/client/Main.java
          deder exec --log-level warning --no-color -m client -t compile
      - name: Run all unit tests
        shell: bash
        run: deder exec --log-level warning --no-color -t test -m server-test -m deder-common-test
      - name: Upload Windows unit test reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-test-reports
          include-hidden-files: true
          path: .deder/out/**/reports/junit/TEST-*.xml
      - name: Stop Deder
        if: always()
        shell: bash
        run: deder shutdown && sleep 1
      - name: Upload Windows failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          include-hidden-files: true
          path: .deder/logs/
