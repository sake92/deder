name: CI Full

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    continue-on-error: true # allow flaky for now
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore Deder output cache
        uses: actions/cache/restore@v4
        with:
          path: .deder/out
          key: deder-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            deder-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: coursier/cache-action@v7
        with:
          extraFiles: deder.pkl
      - name: Set Homebrew env
        shell: bash
        run: echo "HOMEBREW_NO_SANDBOX_LINUX=1" >> $GITHUB_ENV
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Install deder
        run: brew install sake92/tap/deder
      # for testing importing from sbt
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.12.11
      - name: Full integration tests
        run: ./scripts/run-it-tests.sh
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: |
            .deder/out/integration-test/test/run-*/reports/junit/TEST-*.xml
            .deder/out/bsp-integration-test/test/run-*/reports/junit/TEST-*.xml
      - name: Deder output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deder-logs
          path: |
            .deder/logs/server.log
